<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login</title>
  <link rel="stylesheet" href="css/bootstrap.css" />
</head>
<body class="bg-light d-flex flex-column align-items-center justify-content-center" style="min-height:100vh;">

  <!-- Logo + Title -->
  <div class="text-center mb-4">
    <h2 class="fw-bold">
      <i class="bi bi-currency-rupee me-1"></i>SpendSense
    </h2>
    <p class="text-secondary mb-0">Sign in to your account!</p>
  </div>

  <!-- Login Card -->
  <div class="card shadow-sm p-4" style="max-width: 380px; width:100%;">
    <div class="text-center mb-3">
      <h4 class="fw-semibold">Welcome User</h4>
      <p class="text-secondary small">Enter your credentials to access your account</p>
    </div>

    <form action="login.php" method="POST">
      <div class="mb-3">
        <label for="email" class="form-label">Email address</label>
        <input type="email" class="form-control border-dark" id="email" name="email" placeholder="name@example.com" required>
      </div>
      
      <div class="mb-3">
        <label for="password" class="form-label">Password</label>
        <input type="password" class="form-control border-dark" id="password" name="password" placeholder="•••••••" required>
      </div>
      
      <div class="d-grid">
        <button class="btn btn-dark fw-bold" type="submit">Sign in</button>
      </div>
    </form>

    <div class="text-center mt-3">
      <p class="mb-0">Don't have an account? 
        <a href="signup.html" class="text-dark fw-bold">Sign up</a>
      </p>
    </div>
  </div>

  <!-- Back to Home -->
  <div class="mt-3">
    <a href="index.html" class="text-dark">&larr; Back to home</a>
  </div>
  <hr>
  
  <script src="css/bootstrap.bundle.js"></script>
</body>
</html>
